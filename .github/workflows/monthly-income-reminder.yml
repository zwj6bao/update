name: 每月发工资提醒

on:
  schedule:
    # 每月10号 01:00 UTC = 北京时间 09:00
    - cron: "0 1 10 * *"
  workflow_dispatch: {} # 支持在 Actions 页面手动点一下，用来测试

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 发送微信提醒
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: python3 reminders/send_reminder.py
